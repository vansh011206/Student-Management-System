{% if messages %}
  <div class="messages-container mb-3">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm rounded-3" role="alert">
        {% if message.tags == 'success' %}
          <i class="fa-solid fa-circle-check fs-5"></i>
        {% elif message.tags == 'danger' or message.tags == 'error' %}
          <i class="fa-solid fa-triangle-exclamation fs-5"></i>
        {% else %}
          <i class="fa-solid fa-circle-info fs-5"></i>
        {% endif %}
        <div>{{ message }}</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
