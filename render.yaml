services:
  - type: web
    name: edumanage
    runtime: python
    region: singapore
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 60"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "Admin@12345"
      - key: ADMIN_EMAIL
        value: "admin@edumanage.com"
      - key: DATABASE_URL
        fromDatabase:
          name: edumanage-db
          property: connectionString

databases:
  - name: edumanage-db
    databaseName: edumanage
    plan: free
